<style>
  @page { size: letter portrait; margin: 0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Times New Roman', Times, serif; font-size:11pt; color:#000; background:#f8f9fa; }
  .cert-page { padding: 35px 45px; }

  /* Membrete */
  .cert-membrete { display:flex; justify-content:space-between; align-items:flex-start; padding: 0 30px; }
  .membrete-logo { text-align:center; max-width:45%; }
  .membrete-logo img { height:72px; }
  .membrete-logo p { margin:4px 0 0; font-size:8pt; color:#8a929a; line-height:1.3; }
  .membrete-line { border-bottom:1.5px solid #555; margin:12px 0 26px; }

  /* Dos columnas: barra lateral + contenido */
  .cert-grid { display:flex; gap:24px; }
  .cert-sidebar { width:165px; flex-shrink:0; text-align:right; font-size:8.5pt; color:#555; }
  .cert-folio { text-align:left; font-weight:bold; font-size:10pt; margin-bottom:70px; line-height:1.3; }
  .cert-folio span { display:block; font-family:'Courier New', monospace; font-size:10.5pt; }
  .sidebar-block { margin-bottom:20px; }
  .sidebar-title { font-weight:bold; color:#777; margin:0 0 4px; }
  .sidebar-block p { margin:0; line-height:1.5; }

  .cert-main { flex:1; }
  .cert-greeting { margin:0 0 18px; }
  .cert-intro { margin:0 0 10px; }
  .cert-title { text-align:center; letter-spacing:6px; font-size:13pt; font-weight:600; margin:26px 0; }
  .cert-text { text-align:justify; margin:0 0 14px; line-height:1.55; }
  .cert-text strong { font-weight:bold; }

  .cert-table { width:100%; border-collapse:collapse; font-size:8.5pt; margin:16px 0; }
  .cert-table th, .cert-table td { border:1px solid #000; padding:5px 6px; text-align:center; vertical-align:middle; }
  .cert-table th { background:#c9c9c9; font-weight:bold; }

  .cert-cierre { text-align:justify; margin:22px 0; line-height:1.55; }
  .cert-atentamente { text-align:center; letter-spacing:4px; margin:28px 0 6px; }
  .cert-motto { text-align:center; margin:0; }

  .cert-signatures { display:flex; justify-content:center; gap:3rem; margin-top:70px; flex-wrap:wrap; }
  .signature-block { text-align:center; min-width:220px; }
  .signature-block p { margin:2px 0; font-size:10.5pt; }

  [data-editable-key] { outline:2px dashed transparent; padding:1px 3px; border-radius:2px; cursor:text; }
  [data-editable-key]:hover { outline:2px dashed #999; }
  [data-editable-key]:focus { outline:2px dashed #3498db; background:#fff3cd; }
</style>
